<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Casa a Venda Cuiabá</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- FontAwesome for icons -->

    <link rel="stylesheet" href="css/fontawesome.css" />
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <!-- place navbar here -->
      <nav class="navbar navbar-expand-lg bg-white menu fixed-top">
        <div class="container-fluid px-xl-5">
          <a class="navbar-brand" href="#">
            <img
              src="images/casaavendacuiaba.png"
              alt=""
              class="logo img-fluid"
            />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="#inicial">Inicial</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#blog">Blog</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#sobre">Sobre</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#contato">Contato</a>
              </li>
              <li class="nav-item">
                <a class="anunciat-btn btn" href="#anunciar">Anunciar</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div class="container-fluid p-xl-5">
        <!-- Filtro de Busca -->
        <section class="filtro-section py-4">
          <div class="container filtro-container p-4 rounded-4 shadow-sm">
            <form class="row align-items-center justify-content-center g-3">
              <!-- Campo: Bairro (Autocomplete) -->
              <div class="col-lg-4 col-md-6 col-12">
                <label for="bairro" class="form-label fw-semibold"
                  >Bairro</label
                >
                <input
                  type="text"
                  id="bairro"
                  class="form-control"
                  placeholder="Digite o bairro"
                  list="bairros"
                />
                <datalist id="bairros">
                  <option value="Morada do Ouro"></option>
                  <option value="Santa Rosa"></option>
                  <option value="Jardim Itália"></option>
                  <option value="Coxipó"></option>
                  <option value="Boa Esperança"></option>
                  <option value="Jardim das Américas"></option>
                  <option value="CPA I"></option>
                  <option value="CPA II"></option>
                  <option value="CPA III"></option>
                  <option value="Bosque da Saúde"></option>
                </datalist>
              </div>

              <!-- Campo: Quartos -->
              <div class="col-lg-3 col-md-6 col-12">
                <label for="quartos" class="form-label fw-semibold"
                  >Quartos</label
                >
                <select id="quartos" class="form-select">
                  <option value="" selected disabled>Selecione</option>
                  <option value="1">1 Quarto</option>
                  <option value="2">2 Quartos</option>
                  <option value="3">3 Quartos</option>
                  <option value="4">4 Quartos</option>
                  <option value="5+">5 ou mais</option>
                </select>
              </div>

              <!-- Campo: Valor (Slider Range) -->
              <div class="col-lg-3 col-md-6 col-12">
                <label for="valor" class="form-label fw-semibold"
                  >Valor Máximo (R$)</label
                >
                <input
                  type="range"
                  class="form-range"
                  id="valor"
                  min="100000"
                  max="10000000"
                  step="50000"
                  value="500000"
                  oninput="valorOutput.value = this.value"
                />
                <div class="d-flex justify-content-between small">
                  <span>R$100mil</span>
                  <span>R$10mi</span>
                </div>
                <output id="valorOutput" class="fw-bold d-block text-center"
                  >500000</output
                >
              </div>

              <!-- Botão Buscar -->
              <div class="col-lg-2 col-md-6 col-12 text-center">
                <button
                  type="submit"
                  class="btn btn-primary w-100 mt-3 mt-lg-4"
                >
                  <i class="fas fa-search me-2"></i>Buscar
                </button>
              </div>
            </form>
          </div>
        </section>

        <h2 class="titulo01">
          <strong>456</strong> Anúncios de Casas a Venda em Cuiabá
        </h2>
        <div class="row">
          <!-- Card 1 -->
          <div class="col-xxl-2 col-xl-2 col-lg-3 col-md-3 col-sl-12 mb-4">
            <div class="card rounded-4 shadow-md">
              <!-- Carousel com Badges -->
              <div class="card-img position-relative">
                <!-- Ícone de medalha no canto superior esquerdo -->
                <span class="badge badge-top-left">
                  <i class="fas fa-crown"></i>
                </span>

                <!-- Carousel de Imagens -->
                <div
                  id="carouselExampleControls"
                  class="carousel slide"
                  data-bs-ride="carousel"
                >
                  <div class="carousel-inner">
                    <div class="carousel-item active">
                      <img
                        src="images/casa.jpeg"
                        class="d-block w-100"
                        alt="Casa 1"
                      />
                    </div>
                    <div class="carousel-item">
                      <img
                        src="images/casa.jpeg"
                        class="d-block w-100"
                        alt="Casa 2"
                      />
                    </div>
                    <div class="carousel-item">
                      <img
                        src="images/casa.jpeg"
                        class="d-block w-100"
                        alt="Casa 3"
                      />
                    </div>
                  </div>
                  <!-- Botões discretos para navegar -->
                  <button
                    class="carousel-control-prev"
                    type="button"
                    data-bs-target="#carouselExampleControls"
                    data-bs-slide="prev"
                  >
                    <span
                      class="carousel-control-prev-icon"
                      aria-hidden="true"
                    ></span>
                    <span class="visually-hidden">Anterior</span>
                  </button>
                  <button
                    class="carousel-control-next"
                    type="button"
                    data-bs-target="#carouselExampleControls"
                    data-bs-slide="next"
                  >
                    <span
                      class="carousel-control-next-icon"
                      aria-hidden="true"
                    ></span>
                    <span class="visually-hidden">Próximo</span>
                  </button>
                </div>

                <!-- Badge do Bairro no canto superior direito -->
                <span class="badge badge-top-right">
                  <i class="far fa-location-arrow"></i>
                  Morada do Ouro</span
                >
                <!-- Badge do Valor no canto inferior direito -->
                <span class="badge badge-bottom-right">R$ 2.500.000</span>
              </div>

              <!-- Título, Valor e Bairro -->
              <div class="card-body">
                <h5 class="card-title">
                  Casa Térrea no Condomínio Primor das Torres Abaixo do Valor
                </h5>
                <!-- Ícones para detalhes da propriedade -->
                <div class="property-icons">
                  <i class="fas fa-bed me-2"></i><span>3</span>
                  <i class="fas fa-bath me-2"></i><span>3</span>
                  <i class="fas fa-car me-2"></i><span>3</span>
                  <i class="fas fa-arrows-alt me-2"></i><span>150m²</span>
                </div>
                <p class="publication-date">Postado em: 15/09/24, 14:30</p>
              </div>

              <!-- Footer com ícones -->
              <div
                class="card-footer d-flex justify-content-between align-items-center"
              >
                <!-- Ícones com tamanhos iguais -->
                <div class="d-flex align-items-center">
                  <a href="#" class="like text-danger me-1">
                    <i class="fas fa-heart"></i>
                  </a>
                  <a href="#" class="zap text-success me-1">
                    <i class="fab fa-whatsapp"></i>
                  </a>
                  <a href="#" class="save text-warning">
                    <i class="fas fa-bookmark"></i>
                  </a>
                </div>
                <!-- Botão estilizado com Bootstrap -->
                <a href="#" class="btn btn-warning text-light">Ver mais</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->

    <!-- Rodapé fixo estilo menu mobile -->
    <div class="footer-menu">
      <a href="#" class="home-icon">
        <i class="fas fa-home"></i>
      </a>
      <a href="#" class="search-icon">
        <i class="fas fa-search"></i>
      </a>
      <a href="#" class="profile-icon">
        <i class="fas fa-bookmark"></i>
      </a>
      <a href="#" class="profile-icon">
        <i class="fas fa-user"></i>
      </a>
    </div>

    <!-- Formulário de Pesquisa -->

    <!-- Formulário de Pesquisa -->
    <div id="search-form" class="search-form">
      <div class="container">
        <div class="row">
          <!-- Campo para Bairro (Select Dropdown com Busca) -->
          <div class="col-lg-3 col-md-6 col-12 mb-2">
            <div class="form-group">
              <div class="input-group position-relative">
                <span class="input-group-text">Bairro</span>
                <select class="form-control custom-select-arrow" id="bairro">
                  <option value="" disabled selected>Escolha o Bairro</option>
                  <option value="bairro1">Bairro 1</option>
                  <option value="bairro2">Bairro 2</option>
                  <option value="bairro3">Bairro 3</option>
                  <option value="bairro4">Bairro 4</option>
                  <option value="bairro5">Bairro 5</option>
                  <option value="bairro6">Bairro 6</option>
                  <option value="bairro7">Bairro 7</option>
                  <option value="bairro8">Bairro 8</option>
                  <option value="bairro9">Bairro 9</option>
                  <option value="bairro10">Bairro 10</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Campo para Valor Mínimo -->
          <div class="col-lg-3 col-md-6 col-12 mb-2">
            <div class="form-group">
              <div class="input-group">
                <!-- Botão Redondo de Decremento para Valor Mínimo -->
                <button
                  class="btn btn-outline-secondary rounded-circle"
                  type="button"
                  id="decrement-min-btn"
                >
                  -
                </button>

                <span class="input-group-text">Valor Mín R$</span>

                <!-- Campo de Input para o Valor Mínimo -->
                <input
                  type="number"
                  class="form-control"
                  id="valor-minimo"
                  placeholder="Valor Mínimo"
                  min="100000"
                  step="10000"
                  value="100000"
                />

                <!-- Botão Redondo de Incremento para Valor Mínimo -->
                <button
                  class="btn btn-outline-secondary rounded-circle"
                  type="button"
                  id="increment-min-btn"
                >
                  +
                </button>
              </div>
            </div>
          </div>

          <!-- Campo para Valor Máximo -->
          <div class="col-lg-3 col-md-6 col-12 mb-2">
            <div class="form-group">
              <div class="input-group">
                <!-- Botão Redondo de Decremento para Valor Máximo -->
                <button
                  class="btn btn-outline-secondary rounded-circle"
                  type="button"
                  id="decrement-max-btn"
                >
                  -
                </button>

                <span class="input-group-text">Valor Max R$</span>

                <!-- Campo de Input para o Valor Máximo -->
                <input
                  type="number"
                  class="form-control"
                  id="valor-maximo"
                  placeholder="Valor Máximo"
                  min="100000"
                  step="10000"
                  value="150000"
                />

                <!-- Botão Redondo de Incremento para Valor Máximo -->
                <button
                  class="btn btn-outline-secondary rounded-circle"
                  type="button"
                  id="increment-max-btn"
                >
                  +
                </button>
              </div>
            </div>
          </div>

          <!-- Campo para Quartos (Select Dropdown) -->
          <div class="col-lg-3 col-md-6 col-12 mb-2">
            <div class="form-group">
              <div class="input-group position-relative">
                <span class="input-group-text">Quartos</span>
                <select class="form-control custom-select-arrow" id="quartos">
                  <option value="" disabled selected>Quantos Quartos</option>
                  <option value="1">1 Quarto</option>
                  <option value="2">2 Quartos</option>
                  <option value="3">3 Quartos</option>
                  <option value="4">4 Quartos</option>
                  <option value="5oumais">5 ou Mais</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Botões de Ação -->
        <div class="row">
          <div class="col-12 d-flex justify-content-between">
            <button class="btn btn-primary flex-grow-1 me-1">Pesquisar</button>
            <button class="btn btn-secondary flex-grow-1">Limpar Dados</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulário de Pesquisa -->

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
